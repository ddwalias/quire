# Nightly mutation audit of main (merge_gate.py --nightly; docs/mirror/validation.md, "Nightly audit") against the
# Mathcad files in the private repository ddwalias/quire-mathcad-bin.
name: Nightly audit

on:
  schedule:
    # 02:00 Australia/Sydney is 15:00 UTC under AEDT (UTC+11, October to April) and 16:00 UTC under AEST (UTC+10).
    # Both fire; the `when` job keeps the one that is 02:00 in Sydney that day.
    - cron: '0 15 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:
  # No push, pull_request or pull_request_target trigger: code from forks must never run with this job's token.

permissions:
  contents: read
  issues: write

jobs:
  when:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          [ "$(TZ=Australia/Sydney date +%z)" = +1100 ] && today='0 15 * * *' || today='0 16 * * *'
          [ -z "$SCHEDULE" ] || [ "$SCHEDULE" = "$today" ] && run=true || run=false
          echo "run=$run" >> "$GITHUB_OUTPUT"

  nightly:
    needs: when
    if: needs.when.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency: nightly-audit
    steps:
      - env:
          HAS_TOKEN: ${{ secrets.MATHCAD_BIN_TOKEN != '' }}
        run: |
          [ "$HAS_TOKEN" = true ] || { echo '::error::The Actions secret MATHCAD_BIN_TOKEN is missing: add a fine-grained token with read-only Contents access to ddwalias/quire-mathcad-bin.'; exit 1; }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          ref: main
          path: quire
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          repository: ddwalias/quire-mathcad-bin
          token: ${{ secrets.MATHCAD_BIN_TOKEN }}
          ref: main
          path: mathcad-bin
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1  # v5.4.0
        with:
          global-json-file: quire/global.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.14'

      - id: gate
        working-directory: quire
        env:
          MATHCAD_DIR: ${{ github.workspace }}/mathcad-bin/mathcad
          QUIRE_REQUIRE_MATHCAD: '1'
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          set +e
          python3 tools/validation/merge_gate.py --nightly --jobs 4 --results "$RUNNER_TEMP/nightly"
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: nightly-audit
          path: |
            ${{ runner.temp }}/nightly/nightly.json
            ${{ runner.temp }}/nightly/run/summary.json

      - if: always() && steps.gate.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXIT: ${{ steps.gate.outputs.exit }}
        run: |
          report="$RUNNER_TEMP/nightly/nightly.json"
          { echo "Nightly audit of \`main\` failed (exit ${EXIT:-none}): $RUN_URL"; echo
            if [ -f "$report" ]; then printf '```json\n'; cat "$report"; printf '```\n'; else echo 'No nightly.json was written.'; fi
          } > body.md
          issue=$(gh issue list --state open --search '"Nightly audit" in:title' --json number,title \
                    --jq '[.[] | select(.title == "Nightly audit")][0].number // empty')
          if [ -n "$issue" ]; then gh issue comment "$issue" --body-file body.md
          else gh issue create --title 'Nightly audit' --body-file body.md; fi

      - if: steps.gate.outputs.exit != '0'
        run: exit 1
